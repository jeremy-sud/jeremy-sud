name: BOOMFLOW Badge Sync

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# GITHUB_TOKEN is the built-in Actions token, automatically available.
# With `permissions: contents: write` it can checkout AND push to the same repo.
# No PAT or extra secrets required for your own profile repo.
permissions:
  contents: write

jobs:
  sync-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      
      - name: Sync BOOMFLOW badges
        uses: jeremy-sud/boomflow-badges/github-action@main
        with:
          github_username: ${{ github.actor }}
      
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🏅 Update BOOMFLOW badges"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
